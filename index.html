<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow TV</title>
<meta name="theme-color" content="#0b0b10">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://image.tmdb.org">
<link rel="preconnect" href="https://api.themoviedb.org">
<style>
:root{
  --accent:#e5484d; --on-accent:#fff;
  --bg:#0b0b10; --surface:#15151d; --surface2:#1e1e28; --border:#2a2a35;
  --text:#f2f2f5; --muted:#9a9aa8;
  --card-w:150px; --dimv:.85; --base-font:16px;
}
html{font-size:var(--base-font)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);height:100vh;overflow:hidden;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",Tahoma,sans-serif;
  -webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{display:block}

#bg{position:fixed;inset:0;background-size:cover;background-position:center;z-index:0}
#bg-dim{position:fixed;inset:0;background:var(--bg);opacity:var(--dimv);z-index:0}

.screen{display:none;position:relative;z-index:1;height:100vh;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.screen.active{display:block}
.screen.center.active{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}

/* focus */
.focusable{outline:none}
.focusable:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.card:focus-visible{transform:scale(1.04)}

/* buttons / inputs */
.btn{background:var(--accent);color:var(--on-accent);font-weight:700;padding:.7rem 1.4rem;border-radius:10px;display:inline-flex;align-items:center;gap:.5rem}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border);font-weight:600}
.btn.ghost:hover{background:#262633}
.btn.danger{background:#3a1519;color:#ff8d92;border:1px solid #5a2025}
.btn.sm{padding:.4rem .8rem;font-size:.85rem;border-radius:8px}
.input{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:.7rem 1rem;width:100%}
.input:focus{border-color:var(--accent)}
.icon{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* profiles */
.logo{font-size:2.6rem;font-weight:900;letter-spacing:3px}
.logo b{color:var(--accent)}
.sub{color:var(--muted);margin:.4rem 0 2rem}
.profiles{display:flex;flex-wrap:wrap;gap:1.5rem;justify-content:center}
.profile{width:9.5rem;display:flex;flex-direction:column;align-items:center;gap:.8rem;padding:1.2rem .5rem;border-radius:14px}
.profile:hover{background:var(--surface)}
.avatar{width:5.5rem;height:5.5rem;border-radius:50%;background:var(--surface2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:2.4rem;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2rem;width:26rem;max-width:94vw;display:flex;flex-direction:column;gap:1rem;text-align:center}
.err{color:#ff8d92;font-size:.9rem;min-height:1.1em}
.row-btns{display:flex;gap:.8rem;margin-top:1.8rem;flex-wrap:wrap;justify-content:center}

/* nav */
.nav{position:sticky;top:0;z-index:20;background:rgba(11,11,16,.94);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:1rem;padding:.8rem 2rem}
.nav .logo{font-size:1.4rem;letter-spacing:2px}
.clock{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.search{flex:1;max-width:30rem;position:relative;margin-inline:auto}
.search .input{border-radius:999px;padding-inline-start:2.6rem}
.search svg{position:absolute;inset-inline-start:.95rem;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.nav-actions{display:flex;gap:.5rem;align-items:center}
.pill{display:flex;align-items:center;gap:.5rem;background:var(--surface2);border:1px solid var(--border);padding:.5rem .9rem;border-radius:999px;font-size:.9rem;font-weight:600}
.pill:hover{background:#262633}
.pill .avatar{width:1.5rem;height:1.5rem;font-size:.9rem;border:0}
.pill.sq{padding:.5rem .65rem}

/* hero */
.wrap{padding:1.5rem 2rem 3rem}
#hero{position:relative;height:clamp(300px,50vh,480px);border-radius:16px;overflow:hidden;background:var(--surface);margin-bottom:2rem}
#hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .5s}
#hero-img.fade{opacity:0}
.hero-shade{position:absolute;inset:0;background:
  linear-gradient(to top,var(--bg) 4%,rgba(11,11,16,.2) 55%,transparent),
  linear-gradient(to right,rgba(11,11,16,.9) 5%,transparent 65%)}
:root[dir=rtl] .hero-shade{background:
  linear-gradient(to top,var(--bg) 4%,rgba(11,11,16,.2) 55%,transparent),
  linear-gradient(to left,rgba(11,11,16,.9) 5%,transparent 65%)}
.hero-body{position:absolute;inset-inline-start:0;bottom:0;padding:2rem 2.2rem;max-width:44rem;display:flex;flex-direction:column;gap:.7rem}
.hero-meta{color:var(--accent);font-weight:700;font-size:.95rem}
.hero-title{font-size:clamp(1.6rem,3.4vw,2.6rem);font-weight:800;line-height:1.15}
.hero-desc{color:#cfcfd8;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:.95rem}
.hero-btns{display:flex;gap:.7rem;margin-top:.4rem}
.dots{position:absolute;inset-inline-end:1.5rem;bottom:1.2rem;display:flex;gap:.4rem}
.dot{width:.55rem;height:.55rem;border-radius:50%;background:rgba(255,255,255,.35);padding:0}
.dot.on{background:var(--accent);width:1.4rem;border-radius:999px}

/* rows & cards */
.row{margin-bottom:1.8rem;content-visibility:auto;contain-intrinsic-size:auto 340px}
.row-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.7rem}
.row-title{font-size:1.2rem;font-weight:700}
.row-nav{display:flex;gap:.4rem}
.row-nav button{width:2rem;height:2rem;border-radius:50%;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.row-nav button:hover{background:#262633}
.track{display:flex;gap:14px;overflow-x:auto;padding:8px 4px 14px;scrollbar-width:none;scroll-behavior:smooth}
.track::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--card-w),1fr));gap:20px 14px}
.card{width:var(--card-w);flex-shrink:0;cursor:pointer;transition:transform .15s}
.grid .card{width:auto}
.card:hover{transform:scale(1.03)}
.poster{position:relative;height:0;padding-top:150%;border-radius:10px;overflow:hidden;background:var(--surface2)}
.poster img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.fav{position:absolute;top:6px;inset-inline-end:6px;width:30px;height:30px;border-radius:50%;background:rgba(11,11,16,.8);display:flex;align-items:center;justify-content:center;color:#fff}
.fav .icon{width:15px;height:15px}
.fav.on{color:var(--accent)}
.fav.on .icon{fill:currentColor}
.c-title{margin-top:.5rem;font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-meta{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-top:.15rem}
.star{color:#f5c518}
.sk{width:var(--card-w);height:calc(var(--card-w) * 1.5);border-radius:10px;background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);background-size:200% 100%;animation:sh 1.3s infinite;flex-shrink:0}
@keyframes sh{to{background-position:-200% 0}}
.empty{color:var(--muted);text-align:center;padding:3rem 0}

/* details */
.det{padding:1.5rem 2rem 3rem;max-width:80rem;margin:0 auto}
.det-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.2rem}
.det-card{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.det-bd{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.25}
.det-in{position:relative;display:flex;gap:1.8rem;padding:1.8rem;flex-wrap:wrap}
.det-poster{width:11rem;height:16.5rem;border-radius:12px;object-fit:cover;background:var(--surface2)}
.det-info{flex:1;min-width:16rem;display:flex;flex-direction:column;gap:.8rem;justify-content:center}
.det-info h2{font-size:1.8rem;font-weight:800}
.det-info p{color:#cfcfd8;line-height:1.6;max-width:42rem;font-size:.95rem}
.chips{display:flex;gap:.5rem;flex-wrap:wrap}
.chip{background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:.45rem .9rem;border-radius:999px;font-size:.85rem;font-weight:600}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.sec-title{font-size:1.05rem;font-weight:700;margin:1.6rem 0 .7rem}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:.6rem}
.ep{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.7rem 1rem;text-align:start;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep:hover{background:var(--surface2)}
.ep.last{border-color:var(--accent)}
.box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-top:1.6rem;display:flex;flex-direction:column;gap:1rem}
.cmt-form{display:flex;gap:.6rem;flex-wrap:wrap}
.cmt{background:var(--surface2);border-radius:10px;padding:.8rem 1rem;display:flex;flex-direction:column;gap:.3rem}
.cmt-h{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.85rem}
#cmt-list{display:flex;flex-direction:column;gap:.6rem;max-height:14rem;overflow-y:auto}

.more{flex:0 0 1px;width:1px;height:1px}
.filters{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1.2rem}
.filters .input{width:auto;min-width:9rem}
.prov{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;font-size:.85rem;color:var(--muted)}
.prov a{display:inline-flex;align-items:center;gap:.4rem;background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:.3rem .7rem;color:var(--text);text-decoration:none}
.prov img{width:20px;height:20px;border-radius:5px}
.attr{color:var(--muted);font-size:.75rem;text-align:center;margin-top:2rem;line-height:1.6}
.p-hint{flex-basis:100%;color:var(--muted);font-size:.8rem}
/* settings */
.set{padding:1.5rem 2rem;max-width:70rem;margin:0 auto}
.set-layout{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;min-height:32rem}
.tabs{width:15rem;border-inline-end:1px solid var(--border);padding:1rem;display:flex;flex-direction:column;gap:.3rem;flex-shrink:0}
.tab{text-align:start;padding:.8rem 1rem;border-radius:10px;color:var(--muted);font-weight:600}
.tab:hover{background:var(--surface2)}
.tab.on{background:var(--surface2);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
:root[dir=rtl] .tab.on{box-shadow:inset -3px 0 0 var(--accent)}
.pane{display:none;flex:1;padding:1.8rem;flex-direction:column;gap:1.4rem}
.pane.on{display:flex}
.srow{display:flex;justify-content:space-between;align-items:center;gap:1.5rem;flex-wrap:wrap;padding-bottom:1.2rem;border-bottom:1px solid var(--border)}
.srow:last-child{border-bottom:0}
.srow .lbl{font-weight:600}
.srow .hint{color:var(--muted);font-size:.85rem;margin-top:.2rem}
.srow .ctl{min-width:14rem;max-width:22rem;flex:1;display:flex;gap:.6rem;align-items:center;justify-content:flex-end}
.srow .ctl .input{width:auto;flex:1}
.swatches{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:flex-end}
.sw{width:2rem;height:2rem;border-radius:50%;border:2px solid transparent;padding:0}
.sw.on{border-color:#fff}
input[type=color]{width:2.4rem;height:2.4rem;padding:0;border:0;background:none;border-radius:8px}
input[type=range]{flex:1;accent-color:var(--accent)}
.switch{position:relative;width:3rem;height:1.7rem;background:var(--surface2);border:1px solid var(--border);border-radius:999px;flex-shrink:0}
.switch::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:1.3rem;height:1.3rem;border-radius:50%;background:var(--muted);transition:.15s}
.switch.on{background:var(--accent);border-color:var(--accent)}
.switch.on::after{inset-inline-start:calc(100% - 1.3rem - 2px);background:var(--on-accent)}
.plist{display:flex;flex-direction:column;gap:.6rem;width:100%}
.pitem{display:flex;justify-content:space-between;align-items:center;gap:1rem;background:var(--surface2);border-radius:12px;padding:.7rem 1rem;flex-wrap:wrap}
.pitem .who{display:flex;align-items:center;gap:.8rem;font-weight:600}
.pitem .avatar{width:2.4rem;height:2.4rem;font-size:1.2rem}
.pitem .acts{display:flex;gap:.4rem}

/* modal & player */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;display:none;align-items:center;justify-content:center;padding:1rem}
#modal.active{display:flex}
#modal .panel{background:var(--surface)}
.two{display:flex;gap:.6rem}
#player{position:fixed;inset:0;background:#000;z-index:200;display:none;flex-direction:column}
#player.active{display:flex}
.p-top{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.7rem 1.5rem;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
.p-title{font-weight:700}
.p-servers{display:flex;gap:.5rem}
#player iframe{flex:1;width:100%;border:0;background:#000}

/* lite mode */
.lite *{transition:none!important;animation:none!important;scroll-behavior:auto!important}

@media(max-width:700px){
  .nav{flex-wrap:wrap;padding:.7rem 1rem}.search{order:5;max-width:none;flex-basis:100%}
  .wrap,.det,.set{padding-inline:1rem}
  .set-layout{flex-direction:column}.tabs{width:100%;flex-direction:row;overflow-x:auto;border-inline-end:0;border-bottom:1px solid var(--border)}
}
</style>
</head>
<body>
<div id="bg"></div><div id="bg-dim"></div>

<!-- Profiles -->
<div id="profiles-screen" class="screen center">
  <div class="logo">FLOW<b>TV</b></div>
  <div class="sub" data-i18n="whowatch"></div>
  <div class="profiles" id="profiles-list"></div>
  <div class="row-btns">
    <button class="btn ghost focusable" data-act="addProfile" data-i18n="addProfile"></button>
    <button class="btn ghost focusable" data-act="openSettings" data-i18n="settings"></button>
  </div>
</div>

<!-- PIN -->
<div id="pin-screen" class="screen center">
  <div class="panel">
    <div class="avatar" id="pin-avatar" style="margin:0 auto;width:5.5rem;height:5.5rem"></div>
    <h2 id="pin-name"></h2>
    <p style="color:var(--muted)" data-i18n="enterPin"></p>
    <input type="password" id="pin-input" class="input focusable" inputmode="numeric" maxlength="6" placeholder="••••" style="text-align:center;letter-spacing:.4em">
    <div class="err" id="pin-err"></div>
    <button class="btn focusable" style="justify-content:center" data-act="verifyPin" data-i18n="login"></button>
    <button class="btn ghost focusable" style="justify-content:center" data-act="showProfiles" data-i18n="switchProfile"></button>
  </div>
</div>

<!-- Main -->
<div id="main-screen" class="screen">
  <div class="nav">
    <div class="logo">FLOW<b>TV</b></div>
    <div class="clock" id="clock"></div>
    <div class="search">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="text" id="search-input" class="input focusable" data-i18n-ph="search" autocomplete="off">
    </div>
    <div class="nav-actions">
      <button class="pill focusable" data-act="openExplore"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span data-i18n="explore"></span></button>
      <button class="pill sq focusable" data-act="random" title="Random"><svg class="icon" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
      <button class="pill focusable" data-act="openSettings"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span data-i18n="settings"></span></button>
      <button class="pill focusable" data-act="showProfiles"><span class="avatar" id="nav-avatar"></span><span id="nav-name"></span></button>
    </div>
  </div>
  <div class="wrap">
    <section id="hero">
      <img id="hero-img" alt="">
      <div class="hero-shade"></div>
      <div class="hero-body">
        <div class="hero-meta" id="hero-meta"></div>
        <h1 class="hero-title" id="hero-title"></h1>
        <p class="hero-desc" id="hero-desc"></p>
        <div class="hero-btns">
          <button class="btn focusable" id="hero-play" data-act="openItem" data-af><svg class="icon" viewBox="0 0 24 24" style="fill:currentColor"><path d="M7 4v16l13-8z"/></svg><span data-i18n="watchNow"></span></button>
        </div>
      </div>
      <div class="dots" id="hero-dots"></div>
    </section>
    <div id="rows"></div>
    <div class="attr">This product uses the TMDB API but is not endorsed or certified by TMDB.<br>Streaming availability data by JustWatch & ShoofAflam.</div>
  </div>
</div>

<!-- Details -->
<div id="details-screen" class="screen">
  <div class="det">
    <div class="det-top">
      <button class="btn ghost focusable" data-act="goBack" data-i18n="backHome"></button>
    </div>
    <div class="det-card" id="det-card"></div>
    <div id="series-area" style="display:none">
      <div class="sec-title" data-i18n="season"></div>
      <div class="chips" id="seasons"></div>
      <div class="sec-title" data-i18n="episode"></div>
      <div class="eps" id="episodes"></div>
    </div>
    <div class="box">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.8rem">
        <h3 data-i18n="ratings"></h3>
        <span class="chip on" id="avg-rating"></span>
      </div>
      <div class="cmt-form">
        <select id="cmt-rating" class="input focusable" style="width:9rem">
          <option value="5">★★★★★</option><option value="4">★★★★☆</option><option value="3">★★★☆☆</option><option value="2">★★☆☆☆</option><option value="1">★☆☆☆☆</option>
        </select>
        <input type="text" id="cmt-text" class="input focusable" data-i18n-ph="writeComment" style="flex:1;min-width:14rem;width:auto">
        <button class="btn focusable" data-act="addComment" data-i18n="send"></button>
      </div>
      <div id="cmt-list"></div>
    </div>
  </div>
</div>

<!-- Explore -->
<div id="explore-screen" class="screen">
  <div class="det">
    <div class="det-top"><h2 data-i18n="explore"></h2><button class="btn ghost focusable" data-act="goMain" data-i18n="backHome"></button></div>
    <div class="filters">
      <select id="ex-type" class="input focusable"><option value="movie" data-i18n="movies"></option><option value="tv" data-i18n="series"></option></select>
      <select id="ex-dec" class="input focusable"><option value="all" data-i18n="allYears"></option><option value="2020">2020s</option><option value="2010">2010s</option><option value="2000">2000s</option><option value="1990">1990s</option><option value="1980">1980s</option></select>
      <select id="ex-genre" class="input focusable"><option value="" data-i18n="allGenres"></option></select>

    fetch(url).then(r => { clearTimeout(tm); res(r); }, e => { clearTimeout(tm); rej(e); });
  });
}
async function tmdb(path, params, bare){
  const q = ['api_key=' + TMDB_KEY, 'language=' + (bare ? 'en-US' : apiLang())];
  if(!bare){ q.push('include_adult=false'); for(const k in (params || {})) q.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k])); }
  const r = await fetchT(API + path + '?' + q.join('&'), 15000);
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function tmdbSafe(path, params){
  try{ return await tmdb(path, params, false); }
  catch(e){
    lastErr = String((e && e.message) || e);
    try{ return await tmdb(path, {}, true); }
    catch(e2){ lastErr = String((e2 && e2.message) || e2); throw e2; }
  }
}
async function shoofFetch(endpoint){
  const r = await fetchT(SHOOFAFLAM_API + endpoint, 15000);
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function mapItem(r, type){

    title: r.title || r.name || r.title_ar || '', year: (r.release_date || r.first_air_date || r.year || '').slice(0,4) || '—',

    poster: r.poster_path || r.poster_path || '', backdrop: r.backdrop_path || r.poster_path || '', desc: r.overview || '',

}

async function fetchShoof(type){
  try{

    let items = d.titles || d || [];
    items = items.filter(it => (type === 'movie' ? it.type === 'movie' : it.type === 'series'));
    return items.map(r => ({
      key: `shoof_${r.slug}`, id: r.slug, type: type === 'movie' ? 'movie' : 'series',
      title: r.title_ar || r.title_en, year: r.year || '—', rating: r.rating || '—',
      poster: r.poster_path || '', backdrop: r.poster_path || '', desc: '',

}

function ensureCatalog(){
  catalogFailed = false;
  const ck = `flow2_cat_v2_${lang}`, cached = load(ck, null);
  if(cached && Date.now() - cached.t < CACHE_TTL && cached.rows && cached.rows.length){
    catalog = cached.rows; catalog.forEach(r => r.items.forEach(reg)); catalogReady = true; onCatalog(); return;
  }
  if(catalogLoading) return;
  for(const k in rowState) delete rowState[k];
  catalogLoading = true; catalogReady = false; lastErr = ''; renderRows();
  const out = new Array(ROWS.length); let pending = ROWS.length;
  const finish = () => {
    catalogLoading = false;
    const rows = out.filter(Boolean);
    if(!rows.length){ catalogFailed = true; renderRows(); return; }
    catalog = rows; catalog.forEach(r => r.items.forEach(reg)); catalogReady = true;
    save(ck, { t: Date.now(), rows }); onCatalog();
  };
  ROWS.forEach((row, i) => {
    if(row.type === 'shoofaflam_movies' || row.type === 'shoofaflam_tv'){
      fetchShoof(row.type === 'shoofaflam_movies' ? 'movie' : 'series').then(items => {
        if(items.length) out[i] = { k: row.k, items };
      }).catch(() => {}).then(() => { if(--pending === 0) finish(); });
    } else {
      tmdbSafe(row.path, row.p).then(d => {
        const items = (d.results || []).map(r => mapItem(r, row.type)).filter(it => it.poster).slice(0, 20);
        if(items.length) out[i] = { k: row.k, items };
      }).catch(() => {}).then(() => { if(--pending === 0) finish(); });
    }
  });
}

const rowState = {};
let io = null;
function refreshRowsIfDirty(){
  if(!rowsDirty) return;
  rowsDirty = false; const y = $('main-screen').scrollTop; renderRows(); $('main-screen').scrollTop = y;
}
function observeMore(){
  if(!('IntersectionObserver' in window)) return;
  if(!io) io = new IntersectionObserver(es => es.forEach(en => { if(en.isIntersecting) loadMore(en.target.dataset.more, en.target); }), { rootMargin:'0px 500px 0px 500px' });
  document.querySelectorAll('#rows .more').forEach(el => io.observe(el));
}
async function loadMore(k, sentinel){
  const row = catalog.find(r => r.k === k), cfg = ROWS.find(r => r.k === k);
  if(!row || !cfg) return;
  const st = rowState[k] || (rowState[k] = { page:1, loading:false, done:false });
  if(st.loading || st.done) return;
  st.loading = true;
  
  try{
    if(cfg.type === 'shoofaflam_movies' || cfg.type === 'shoofaflam_tv'){
        st.done = true; 
    } else {
        const d = await tmdb(cfg.path, Object.assign({}, cfg.p, { page: st.page + 1 }));
        st.page++;
        const have = {}; row.items.forEach(i => { have[i.key] = 1; });
        const fresh = (d.results || []).map(r => mapItem(r, cfg.type)).filter(it => it.poster && !have[it.key]);
        fresh.forEach(it => { reg(it); row.items.push(it); });
        if(sentinel && sentinel.parentNode && fresh.length){
          const tmp = document.createElement('div'); tmp.innerHTML = fresh.map(cardHTML).join('');
          while(tmp.firstChild) sentinel.parentNode.insertBefore(tmp.firstChild, sentinel);
        }
        if(st.page >= Math.min(d.total_pages || 1, 25) || !(d.results || []).length){
          st.done = true; if(sentinel){ if(io) io.unobserve(sentinel); sentinel.remove(); }
        } else if(sentinel && io){ io.unobserve(sentinel); io.observe(sentinel); }
    }
  }catch(e){ st.done = true; }
  st.loading = false;
}

function exParams(){

  const f = type === 'movie' ? 'primary_release_date' : 'first_air_date';

  p[f + '.gte'] = (dec === 'all' ? '1980' : dec) + '-01-01';
  p[f + '.lte'] = (dec === 'all' || +dec === 2020) ? today : (+dec + 9) + '-12-31';
  if(sort === 'rate'){ p.sort_by = 'vote_average.desc'; p['vote_count.gte'] = type === 'movie' ? 500 : 200; }
  else if(sort === 'new'){ p.sort_by = f + '.desc'; p['vote_count.gte'] = 30; }
  else { p.sort_by = 'popularity.desc'; p['vote_count.gte'] = 100; }
  if(genre) p.with_genres = genre;
  return { path: '/discover/' + type, p, type: type === 'movie' ? 'movie' : 'series' };
}
async function exLoad(reset){
  if(reset){ ex.seq++; ex.page = 0; ex.done = false; ex.loading = false; $('ex-grid').innerHTML = ''; $('ex-status').textContent = ''; }
  if(ex.loading || ex.done) return;
  ex.loading = true; const seq = ex.seq, cfg = exParams();
  try{
    const d = await tmdb(cfg.path, Object.assign({}, cfg.p, { page: ex.page + 1 }));
    if(seq !== ex.seq) return;
    ex.page++;
    const items = (d.results || []).map(r => mapItem(r, cfg.type)).filter(it => it.poster);
    $('ex-grid').insertAdjacentHTML('beforeend', items.map(cardHTML).join(''));
    if(ex.page >= Math.min(d.total_pages || 1, 500) || !(d.results || []).length) ex.done = true;
    if(!$('ex-grid').children.length) $('ex-status').textContent = t('noResults');
  }catch(e){ if(seq === ex.seq){ ex.done = true; $('ex-status').textContent = t('loadFail'); } }
  if(seq === ex.seq){
    ex.loading = false;
    if(!ex.done && exIO){ exIO.unobserve($('ex-more')); exIO.observe($('ex-more')); }
  }
}

  if(!q){ searchMode = false; renderMain(); return; }
  searchMode = true; $('hero').style.display = 'none';
  $('rows').innerHTML = `<div class="row"><div class="track">${'<div class="sk"></div>'.repeat(8)}</div></div>`;
  let items = [];
  try{
    const d = await tmdb('/search/multi', { query:q });
    items = (d.results || []).filter(r => (r.media_type === 'movie' || r.media_type === 'tv') && r.poster_path)
      .map(r => mapItem(r, r.media_type === 'tv' ? 'series' : 'movie'));
  }catch{
    const ql = q.toLowerCase(); const seen = {};
    catalog.forEach(r => r.items.forEach(it => { if(it.title.toLowerCase().includes(ql) && !seen[it.key]){ seen[it.key] = 1; items.push(it); } }));
  }
  if(seq !== searchSeq) return;
  $('rows').innerHTML = `<div class="row-title" style="margin-bottom:1rem">${t('searchResults')}: “${esc(q)}”</div>` +
    (items.length ? `<div class="grid">${items.map(cardHTML).join('')}</div>` : `<div class="empty">${t('noResults')}</div>`);
}

/* ============ FAVORITES / HISTORY ============ */
function toggleFav(key){
  if(!me) return; const it = itemMap[key]; if(!it) return;
  let favs = getFavs(); const i = favs.findIndex(f => f.key === key);
  if(i > -1) favs.splice(i, 1); else favs.unshift(it);
  save(K('favs'), favs);
  document.querySelectorAll(`[data-fav="${key}"]`).forEach(b => b.classList.toggle('on', i === -1));
  if(activeScreen() === 'main-screen' && !searchMode){ const y = $('main-screen').scrollTop; renderRows(); $('main-screen').scrollTop = y; }
  if(activeScreen() === 'details-screen' && current && current.key === key) updateDetBtns();
}
function pushHistory(it){
  let h = getHist().filter(x => x.key !== it.key); h.unshift(it); save(K('hist'), h.slice(0, 12)); rowsDirty = true;
}

/* ============ DETAILS ============ */
const statusKey = key => K('st') + '_' + key;
function openItem(key){
  const it = itemMap[key]; if(!it) return;
  backTo = activeScreen() === 'explore-screen' ? 'explore-screen' : 'main-screen'; lastCardKey = key;
  current = it; stopHero();
  const st = load(statusKey(key), '');
  $('det-card').innerHTML = `
    ${it.backdrop ? `<img class="det-bd" src="${posterUrl(it)}" alt="" decoding="async">` : ''}
    <div class="det-in">
      <img class="det-poster" src="${posterUrl(it)}" alt="">
      <div class="det-info">
        <h2>${esc(it.title)}</h2>
        <div class="chips"><span class="chip">${esc(it.year)}</span><span class="chip star">★ ${esc(it.rating)}</span><span class="chip">${it.type === 'series' ? 'TV' : 'Movie'}</span></div>
        <p>${esc(it.desc) || '—'}</p>
        <div class="chips" id="st-chips">
          ${['want','watching','watched'].map(s => `<button class="chip focusable${st===s?' on':''}" data-act="status" data-s="${s}">${t('status'+s[0].toUpperCase()+s.slice(1))}</button>`).join('')}
        </div>
        <div class="hero-btns">
          <button class="btn focusable" id="det-play" data-act="play" data-af></button>
          <button class="btn ghost focusable" id="det-fav" data-act="detFav"></button>
          <button class="btn ghost focusable" data-act="trailer">${t('trailer')}</button>
        </div>
        <div id="providers" class="prov"></div>
      </div>
    </div>`;
  updateDetBtns(); loadProviders(it);
  const area = $('series-area');
  if(it.type === 'series' && it.provider !== 'shoofaflam'){ area.style.display = ''; loadSeasons(it); } else area.style.display = 'none';
  renderComments(); showScreen('details-screen');
}
function updateDetBtns(){
  if(!current) return;
  const last = load(K('last') + '_' + current.key, null);
  $('det-play').innerHTML = ICON_PLAY + ' ' + (last && current.type === 'series' ? `${t('continueEp')} S${last.s}E${last.e}` : t('watchNow'));
  $('det-fav').textContent = isFav(current.key) ? t('inList') : t('addList');
}
async function loadSeasons(it){
  $('seasons').innerHTML = ''; $('episodes').innerHTML = '';
  try{
    const d = await tmdb(`/tv/${it.id}`);
    if(!current || current.key !== it.key) return;
    const seasons = (d.seasons || []).filter(s => s.season_number > 0);
    const last = load(K('last') + '_' + it.key, null);
    const start = last && seasons.some(s => s.season_number === last.s) ? last.s : (seasons[0] && seasons[0].season_number);
    $('seasons').innerHTML = seasons.map(s => `<button class="chip focusable${s.season_number===start?' on':''}" data-act="season" data-n="${s.season_number}">${esc(s.name)}</button>`).join('');
    if(start != null) selectSeason(start);
  }catch{ $('episodes').innerHTML = `<div class="empty">${t('loadFail')}</div>`; }
}
async function selectSeason(n){
  document.querySelectorAll('#seasons .chip').forEach(c => c.classList.toggle('on', +c.dataset.n === n));
  const it = current, box = $('episodes'), ck = it.id + '_' + n;
  box.innerHTML = '<div class="empty">…</div>';
  try{
    if(!seasonCache[ck]) seasonCache[ck] = (await tmdb(`/tv/${it.id}/season/${n}`)).episodes || [];
    if(current !== it) return;
    const last = load(K('last') + '_' + it.key, null);
    box.innerHTML = seasonCache[ck].map(e => `<button class="ep focusable${last && last.s===n && last.e===e.episode_number?' last':''}" data-act="ep" data-s="${n}" data-e="${e.episode_number}">${e.episode_number}. ${esc(e.name || 'Episode ' + e.episode_number)}</button>`).join('');
  }catch{ box.innerHTML = `<div class="empty">${t('loadFail')}</div>`; }
}
function playCurrent(){
  if(!current) return;
  if(current.type === 'movie'){ openPlayer(current, 0, 0); return; }
  const last = load(K('last') + '_' + current.key, null);
  if(last){ openPlayer(current, last.s, last.e); return; }
  const first = document.querySelector('#episodes .ep'); if(first) first.click();
}

/* ============ PROVIDERS & TRAILER ============ */
async function loadProviders(it){
  const box = $('providers'); if(!box) return;
  box.innerHTML = '';
  if(it.provider === 'shoofaflam'){ box.innerHTML = `<span style="color:var(--accent)">${t('shoofaflamTitle')}</span>`; return; }
  try{
    const d = await tmdb('/' + (it.type === 'series' ? 'tv' : 'movie') + '/' + it.id + '/watch/providers', {});
    if(!current || current.key !== it.key) return;
    const r = (d.results || {})[settings.region || 'MA'];
    const all = r ? [].concat(r.flatrate || [], r.rent || [], r.buy || []) : [];
    const seen = {}, uniq = all.filter(p => seen[p.provider_id] ? false : (seen[p.provider_id] = 1));
    if(!uniq.length){ box.innerHTML = '<span>' + esc(t('noProviders')) + '</span>'; return; }
    box.innerHTML = '<span>' + esc(t('whereToWatch')) + ':</span>' + uniq.slice(0, 8).map(p =>
      '<a href="' + esc(r.link) + '" target="_blank" rel="noopener noreferrer">' + (p.logo_path ? '<img src="' + IMG + '/w45' + p.logo_path + '" alt="">' : '') + esc(p.provider_name) + '</a>').join('') + '<small>JustWatch</small>';
  }catch(e){}
}
async function openTrailer(){
  if(!current) return;
  if(current.provider === 'shoofaflam'){ alert(t('noTrailer')); return; }
  const it = current;
  try{
    const d = await tmdb('/' + (it.type === 'series' ? 'tv' : 'movie') + '/' + it.id + '/videos', { include_video_language: [lang, 'en', 'null'].join(',') });
    const vids = (d.results || []).filter(v => v.site === 'YouTube');
    const v = vids.find(x => x.type === 'Trailer' && x.official) || vids.find(x => x.type === 'Trailer') || vids[0];
    if(!v){ alert(t('noTrailer')); return; }
    $('p-title').textContent = it.title + ' · ' + t('trailer');
    $('p-servers').style.display = 'none'; $('p-hint').textContent = ''; playerCtx = null;
    $('p-frame').src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(v.key) + '?autoplay=1&rel=0';
    $('player').classList.add('active');
  }catch(e){ alert(t('loadFail')); }
}

/* ============ COMMENTS ============ */
const cmtKey = key => `flow2_cmts_${key}`;
function renderComments(){
  const key = current.key, list = load(cmtKey(key), []);
  $('avg-rating').textContent = list.length
    ? `${t('siteRating')}: ${(list.reduce((a, c) => a + c.rating, 0) / list.length).toFixed(1)} / 5 (${list.length})`
    : t('noRating');
  $('cmt-list').innerHTML = list.length ? list.map(c => `
    <div class="cmt"><div class="cmt-h"><b>${esc(c.user)}</b><span style="display:flex;gap:.6rem;align-items:center"><span class="star">${'★'.repeat(c.rating)}${'☆'.repeat(5 - c.rating)}</span>
    ${me && c.user === me.name ? `<button class="btn danger sm focusable" data-act="delCmt" data-id="${c.id}">${t('delete')}</button>` : ''}</span></div><div>${esc(c.text)}</div></div>`).join('')
    : `<div class="empty" style="padding:1rem 0">${t('noComments')}</div>`;
}
function addComment(){
  const text = $('cmt-text').value.trim(); if(!text || !me || !current) return;
  const list = load(cmtKey(current.key), []);
  list.unshift({ id: Date.now(), user: me.name, rating: +$('cmt-rating').value, text });
  save(cmtKey(current.key), list); $('cmt-text').value = ''; renderComments();
}

/* ============ PLAYER ============ */
let playerCtx = null;
function srcFor(srv, it, s, e){
  if(!srv) return 'about:blank';
  if(srv.id === 'shoofaflam'){
    return `https://shoofaflam.tv/embed/${it.slug}`;
  }
  return it.type === 'movie' ? srv.movie(it.id) : srv.tv(it.id, s, e);
}

function openPlayer(it, s, e){
  playerCtx = { it, s, e };
  pushHistory(it);
  if(it.type === 'series' && it.provider !== 'shoofaflam'){ save(K('last') + '_' + it.key, { s, e }); }
  
  $('p-title').textContent = it.type === 'series' && it.provider !== 'shoofaflam' ? `${it.title} · S${s}E${e}` : it.title;
  $('p-hint').textContent = t('playHint');
  
  const isArabic = (it.provider === 'shoofaflam');
  const availableServers = SERVERS.filter(sv => isArabic ? sv.id === 'shoofaflam' : sv.id !== 'shoofaflam');
  
  let start = availableServers.findIndex(x => x.id === settings.server);
  if(start === -1) start = 0; 
  
  $('p-servers').style.display = '';
  $('p-server-select').innerHTML = availableServers.map((sv, i) => '<option value="' + sv.id + '">' + esc(sv.name) + '</option>').join('');
  $('p-server-select').value = availableServers[start].id;
  
  $('p-frame').src = srcFor(availableServers[start], it, s, e);
  $('player').classList.add('active');
}
function closePlayer(){
  $('p-frame').src = 'about:blank'; $('player').classList.remove('active');
  if(current && activeScreen() === 'details-screen'){ updateDetBtns(); if(current.type === 'series' && current.provider !== 'shoofaflam'){ const n = document.querySelector('#seasons .chip.on'); if(n) selectSeason(+n.dataset.n); } }
  if(activeScreen() === 'main-screen') renderRows();
}

/* ============ DATA ============ */
function exportData(){
  const out = {};
  for(let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if(k.startsWith('flow')) out[k] = localStorage.getItem(k); }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out)], { type:'application/json' }));
  a.download = 'flow-tv-backup.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importData(file){
  const r = new FileReader();
  r.onload = () => {
    try{ const d = JSON.parse(r.result); Object.keys(d).forEach(k => { if(k.startsWith('flow') && !k.startsWith('flow2_cat_')) localStorage.setItem(k, d[k]); }); location.reload(); }
    catch{ alert('Invalid file'); }
  };
  r.readAsText(file);
}

/* ============ ACTIONS ============ */
const actions = {
  pickProfile: el => pickProfile(+el.dataset.id),
  addProfile: () => openModal(null),
  editProfile: el => openModal(+el.dataset.id),
  saveProfile, closeModal, verifyPin, showProfiles,
  changePin: el => changePin(+el.dataset.id),
  delProfile: el => delProfile(+el.dataset.id),
  openSettings: () => { syncSettingsUI(); showScreen('settings-screen'); },
  backFromSettings: () => { if(me){ showScreen('main-screen'); renderMain(); } else showProfiles(); },
  goMain: () => { showScreen('main-screen', true); refreshRowsIfDirty(); setupHeroTimer(); },
  goBack: () => {
    showScreen(backTo, true);
    if(backTo === 'main-screen'){ refreshRowsIfDirty(); setupHeroTimer(); }
    setTimeout(() => { const c = document.querySelector('#' + backTo + ' .card[data-key="' + lastCardKey + '"]'); if(c) c.focus({ preventScroll:true }); }, 80);
  },
  openExplore: () => {
    showScreen('explore-screen', true);
    if(!ex.inited){ ex.inited = true; if('IntersectionObserver' in window){ exIO = new IntersectionObserver(es => { if(es[0].isIntersecting && activeScreen() === 'explore-screen') exLoad(false); }, { rootMargin:'0px 0px 800px 0px' }); exIO.observe($('ex-more')); } exGenres(); exLoad(true); }
  },
  openItem: el => openItem(el.dataset.key),
  random: () => { const all = []; catalog.forEach(r => all.push(...r.items)); if(all.length) openItem(all[Math.floor(Math.random() * all.length)].key); },
  heroTo: el => setHero(+el.dataset.i, false),
  retry: () => ensureCatalog(),
  play: playCurrent,
  detFav: () => toggleFav(current.key),
  trailer: () => openTrailer(),
  status: el => { save(statusKey(current.key), el.dataset.s); document.querySelectorAll('#st-chips .chip').forEach(c => c.classList.toggle('on', c === el)); },
  season: el => selectSeason(+el.dataset.n),
  ep: el => openPlayer(current, +el.dataset.s, +el.dataset.e),
  addComment, delCmt: el => { if(!confirm(t('confirmDel'))) return; save(cmtKey(current.key), load(cmtKey(current.key), []).filter(c => c.id !== +el.dataset.id)); renderComments(); },
  closePlayer,
  tab: el => {
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === el));
    document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === el.dataset.tab));
  },
  accent: el => { settings.accent = el.dataset.c; saveSettings(); applySettings(); syncSettingsUI(); },
  applyBg: () => { settings.bg = $('bg-url').value.trim(); saveSettings(); applySettings(); },
  resetBg: () => { settings.bg = ''; $('bg-url').value = ''; saveSettings(); applySettings(); },
  toggle: el => { const k = el.dataset.key; settings[k] = !settings[k]; saveSettings(); applySettings(); syncSettingsUI(); if(k === 'showHistory') renderRows(); },
  clearHistory: () => { if(me && confirm(t('confirmClear'))){ del(K('hist')); } },
  clearFavs: () => { if(me && confirm(t('confirmClear'))){ del(K('favs')); } },
  resetSettings: () => { if(confirm(t('confirmClear'))){ del(K('set')); loadSettings(); syncSettingsUI(); } },
  saveNet: () => { save('flow2_net', { api: $('net-api').value.trim(), img: $('net-img').value.trim() }); Object.keys(localStorage).filter(k => k.indexOf('flow2_cat_') === 0).forEach(k => del(k)); location.reload(); },
  resetNet: () => { del('flow2_net'); Object.keys(localStorage).filter(k => k.indexOf('flow2_cat_') === 0).forEach(k => del(k)); location.reload(); },
  exportData, importData: () => $('import-file').click()
};

document.addEventListener('click', e => {
  const rs = e.target.closest('[data-scroll]');
  if(rs){ const tr = rs.closest('.row').querySelector('.track'); const rtl = document.documentElement.dir === 'rtl'; tr.scrollBy({ left: (+rs.dataset.scroll) * (rtl ? -1 : 1) * tr.clientWidth * 0.85 }); return; }
  const fav = e.target.closest('[data-fav]'); if(fav){ e.stopPropagation(); toggleFav(fav.dataset.fav); return; }
  const act = e.target.closest('[data-act]'); if(act){ const fn = actions[act.dataset.act]; if(fn) fn(act, e); return; }
  const card = e.target.closest('.card[data-key]'); if(card) openItem(card.dataset.key);
});

/* inputs */
$('search-input').addEventListener('input', onSearchInput);
$('pin-input').addEventListener('keydown', e => { if(e.key === 'Enter') verifyPin(); });
$('cmt-text').addEventListener('keydown', e => { if(e.key === 'Enter') addComment(); });
$('m-type').addEventListener('change', toggleAvatarPh);
$('accent-custom').addEventListener('input', e => { settings.accent = e.target.value; saveSettings(); applySettings(); });
$('dim').addEventListener('input', e => { settings.dim = +e.target.value; $('dim-val').textContent = Math.round(settings.dim * 100) + '%'; saveSettings(); applySettings(); });
$('font').addEventListener('change', e => { settings.font = +e.target.value; saveSettings(); applySettings(); });
$('card').addEventListener('change', e => { settings.card = +e.target.value; saveSettings(); applySettings(); });
$('server').addEventListener('change', e => { settings.server = e.target.value; saveSettings(); });
$('region').addEventListener('change', e => { settings.region = e.target.value; saveSettings(); });
$('p-server-select').addEventListener('change', e => {
  if(!playerCtx) return;
  const sv = SERVERS.find(x => x.id === e.target.value); 
  if(!sv) return;
  $('p-frame').src = srcFor(sv, playerCtx.it, playerCtx.s, playerCtx.e);
});
$('ex-type').addEventListener('change', () => { exGenres(); exLoad(true); });
['ex-dec','ex-genre','ex-sort'].forEach(id => $(id).addEventListener('change', () => exLoad(true)));
$('lang').addEventListener('change', e => {
  lang = e.target.value; save('flow2_lang', lang); applyLang(); syncSettingsUI();
  ex.inited = false; $('ex-grid').innerHTML = ''; catalogReady = false; catalogLoading = false; catalog = []; if(me) ensureCatalog();
});
$('import-file').addEventListener('change', e => { if(e.target.files[0]) importData(e.target.files[0]); });

/* image fallback */
document.addEventListener('error', e => {
  const im = e.target;
  if(im.tagName === 'IMG' && !im.dataset.f){ im.dataset.f = 1; im.src = PLACEHOLDER; }
}, true);

/* keyboard: spatial navigation + back */
document.addEventListener('keydown', e => {
  const tag = (document.activeElement || {}).tagName;
  const typing = tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA';
  if(e.key === 'Escape' || (e.key === 'Backspace' && !typing)){
    if($('player').classList.contains('active')) closePlayer();
    else if($('modal').classList.contains('active')) closeModal();
    else if(activeScreen() === 'details-screen') actions.goBack();
    else if(activeScreen() === 'explore-screen') actions.goMain();
    else if(activeScreen() === 'settings-screen') actions.backFromSettings();
    return;
  }
  const cur = document.activeElement;
  if((e.key === 'Enter' || e.key === ' ') && cur && cur.classList.contains('card')){ e.preventDefault(); cur.click(); return; }
  if((e.key === 'f' || e.key === 'F') && cur && cur.classList.contains('card') && !typing){ toggleFav(cur.dataset.key); return; }

  if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) return;
  if(typing && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && tag !== 'SELECT') return;
  if(tag === 'SELECT') return;
  const scope = $('player').classList.contains('active') ? $('player') : $('modal').classList.contains('active') ? $('modal') : document.querySelector('.screen.active');
  if(!scope) return;
  if(!cur || !scope.contains(cur) || !cur.classList.contains('focusable')){ const f = scope.querySelector('.focusable'); if(f){ e.preventDefault(); f.focus(); } return; }
  e.preventDefault();
  const vh = innerHeight, list = Array.from(scope.querySelectorAll('.focusable')).filter(el => el !== cur && el.offsetParent !== null);
  const r0 = cur.getBoundingClientRect(), cx = r0.left + r0.width / 2, cy = r0.top + r0.height / 2;
  let best = null, bd = Infinity;
  for(const el of list){
    const r = el.getBoundingClientRect();
    if(r.width === 0 || r.bottom < -vh || r.top > vh * 2) continue;
    const dx = r.left + r.width / 2 - cx, dy = r.top + r.height / 2 - cy;
    const sameRow = Math.abs(dy) < Math.max(r0.height, r.height) * 0.6;
    let ok = false;
    if(e.key === 'ArrowRight') ok = dx > 8 && sameRow;
    else if(e.key === 'ArrowLeft') ok = dx < -8 && sameRow;
    else if(e.key === 'ArrowDown') ok = dy > Math.min(r0.height, r.height) * 0.5;
    else ok = dy < -Math.min(r0.height, r.height) * 0.5;
    if(!ok) continue;
    const d = (e.key === 'ArrowLeft' || e.key === 'ArrowRight') ? Math.abs(dx) + Math.abs(dy) * 3 : Math.abs(dy) + Math.abs(dx) * 2;
    if(d < bd){ bd = d; best = el; }
  }
  if(best){ best.focus({ preventScroll:true }); best.scrollIntoView({ block:'nearest', inline:'nearest', behavior: settings.lite ? 'auto' : 'smooth' }); }
});

/* clock */
function tick(){ $('clock').textContent = new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }); }
tick(); setInterval(tick, 30000);

/* ============ BOOT ============ */
applyLang();
loadSettings();
showProfiles();      
ensureCatalog();     
</script>
